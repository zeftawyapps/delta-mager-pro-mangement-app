<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- 📈 Search Engine Optimization (SEO) -->
  <title>local</title>
  <meta name="description" content="دومانسي - متجرك الإلكتروني للتسوق وتلبية كافة احتياجاتك.">
  <meta name="keywords" content="دومانسي, متجر, تسوق">
  <meta name="author" content="local">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://local-admin.web.app/">

  <!-- 👥 Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://local-admin.web.app/">
  <meta property="og:title" content="local">
  <meta property="og:description" content="دومانسي - متجرك الإلكتروني للتسوق وتلبية كافة احتياجاتك.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- 🐦 Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://local-admin.web.app/">
  <meta name="twitter:title" content="local">
  <meta name="twitter:description" content="دومانسي - متجرك الإلكتروني للتسوق وتلبية كافة احتياجاتك.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- 📱 Progressive Web App (PWA) & iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="local">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#0175C2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
